<main class="shop-page">
  <header class="shop-header">
    <h1>Shop ♥</h1>
    <p class="subtitle">Handmade sweet treats, made with love.</p>
  </header>

  <!-- Beautiful Premium Tab Toggler -->
  <div class="fulfillment-tabs">
    <button 
      class="tab-btn" 
      [class.active]="currentFulfillmentMode === 'scheduled'" 
      (click)="changeFulfillmentMode('scheduled')">
      <span class="tab-icon">📅</span>
      <span class="tab-label">Scheduled Preorder</span>
    </button>
    <button 
      class="tab-btn" 
      [class.active]="currentFulfillmentMode === 'instant'" 
      (click)="changeFulfillmentMode('instant')">
      <span class="tab-icon">⚡</span>
      <span class="tab-label">Same-day Instant</span>
    </button>
  </div>

  <!-- Premium Mobile Filter Toggle Bar -->
  <div class="mobile-filter-bar">
    <button class="mobile-filter-toggle" (click)="toggleFilters()" aria-label="Open filters">
      <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h12M4 18h8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Filters & Refine</span>
    </button>
    <span class="results-count">{{ totalElements }} {{ totalElements === 1 ? 'treat' : 'treats' }} available</span>
  </div>

  <!-- Glassmorphic Backdrop overlay -->
  <div class="filters-backdrop" [class.show]="isFilterOpen" (click)="toggleFilters()"></div>

  <div class="shop-layout">
    <aside class="shop-filters" [class.open]="isFilterOpen" aria-label="Shop filters">
      <!-- Drawer Header visible only on mobile -->
      <div class="drawer-header">
        <h3>Filters</h3>
        <button class="close-drawer-btn" (click)="toggleFilters()" aria-label="Close filters">
          <svg class="close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <section class="categories card-section">
        <h4>CATEGORIES</h4>
        <ul>
          <li *ngFor="let c of categories">
            <button class="cat-btn" [class.active]="(tempCategory === null && c.id === null) || (tempCategory?.id === c.id)" (click)="selectCategoryDraft(c)">
              <span class="radio" aria-hidden="true"><span class="dot"></span></span>
              <span class="cat-label">{{ c.name }}</span>
            </button>
          </li>
        </ul>
      </section>

      <section class="price card-section">
        <h4>PRICE</h4>
        <div class="price-range">
          <input type="range" min="0" [max]="priceRangeMax" step="1" [value]="tempPrice" (input)="onPriceChange($event)" />
          <div class="price-labels"><span>$0</span><span>Up to ${{ tempPrice.toFixed(2) }}</span></div>
        </div>
        <button class="apply-btn" (click)="applyFilters()">APPLY <span class="button-heart">♥</span></button>
      </section>
    </aside>

    <section class="shop-grid">
      <!-- Premium Search Input Bar -->
      <div class="search-bar-container">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input 
            type="text" 
            placeholder="Search sweet treats..." 
            [(ngModel)]="searchQuery" 
            (input)="onSearchInput($event)"
            aria-label="Search products"
          />
          <button *ngIf="searchQuery" class="clear-search-btn" (click)="clearSearch()" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="grid">
        <app-product-card *ngFor="let p of filteredProducts"
          [product]="p"
          [fulfillmentMode]="currentFulfillmentMode">
        </app-product-card>
      </div>
      <!-- pagination controls -->
      <div class="pagination" *ngIf="(totalPages && totalPages > 1) || (totalElements && totalElements > size)">
        <div class="pagination-inner">
          <button class="page-btn primary" (click)="prevPage()" [disabled]="page === 0" aria-label="Previous page">
            <span class="chev">‹</span>
            <span class="btn-label">Previous</span>
          </button>

          <div class="page-info">Page <strong>{{ page + 1 }}</strong> of <strong>{{ totalPages || 1 }}</strong></div>

          <button class="page-btn primary" (click)="nextPage()" [disabled]="page + 1 >= totalPages" aria-label="Next page">
            <span class="btn-label">Next</span>
            <span class="chev">›</span>
          </button>
        </div>
      </div>
    </section>
  </div>
</main>
