@if (products.length > 0) {
  <section class="instant-delivery" aria-labelledby="instant-delivery-title">
    <div class="instant-header">
      <h2 id="instant-delivery-title" class="section-title">
        <span class="title-flash" aria-hidden="true">⚡</span>
        Instant Treats
        <span class="title-flash" aria-hidden="true">⚡</span>
      </h2>
      <p class="section-subtitle">freshly baked and ready to be delivered right now, order now before they’re gone🤎</p>
    </div>
    <div class="treat-grid">
      @for (product of products; track product) {
        <app-product-card [product]="product" fulfillmentMode="instant">
        </app-product-card>
      }
    </div>
    <div class="section-footer">
      <a class="view-all" routerLink="/shop" [queryParams]="{ fulfillment: 'instant' }">
        View All Instant Treats
        <span class="button-flash" aria-hidden="true">⚡</span>
      </a>
    </div>
  </section>
}
