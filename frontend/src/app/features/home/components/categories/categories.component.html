<section class="categories-panel" aria-label="Shop categories">
  <div class="categories" #categoriesContainer (scroll)="onCategoriesScroll()">
    @for (category of categories; track category) {
      <article class="category" (click)="onCategoryClick(category.id)" style="cursor: pointer;">
        <div [class]="'category-icon ' + getCategoryClass(category.name)" aria-hidden="true">
          <span
            class="category-icon-inner"
            [style.backgroundImage]="category.imageUrl ? 'url(' + category.imageUrl + ')' : null"
            [style.width]="category.imageUrl ? '5.2rem' : '3.8rem'"
            [style.height]="category.imageUrl ? '5.2rem' : '3.8rem'"
            [style.borderRadius]="category.imageUrl ? '50%' : null"
            [style.backgroundSize]="category.imageUrl ? 'cover' : 'contain'">
          </span>
        </div>
        <h3>{{ category.name }}</h3>
      </article>
    }
  </div>

  <div class="swipe-hint left" [class.hidden]="!canScrollLeft" aria-hidden="true"></div>
  <div class="swipe-hint right" [class.hidden]="!canScrollRight" aria-hidden="true"></div>

  @if (pages.length > 1) {
    <div class="carousel-dots">
      @for (p of pages; track p; let i = $index) {
        <button
          type="button"
          class="dot"
          [class.active]="i === activePage"
          (click)="scrollToPage(i)"
          [attr.aria-label]="'Go to page ' + (i + 1)">
        </button>
      }
    </div>
  }

  <div class="panel-heart" aria-hidden="true">♥</div>
</section>
