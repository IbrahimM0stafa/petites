<section class="checkout-card" [formGroup]="checkoutForm">
  <div class="card-title-wrap">
    <svg class="card-title-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
    </svg>
    <h2>Boutique Coupon</h2>
  </div>
  
  <div class="coupon-row">
    <div class="input-with-icon">
      <input type="text" class="coupon-input" formControlName="couponCode" placeholder="Enter coupon code" />
      <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
      </svg>
    </div>
    <button type="button" class="purchase-btn purchase-btn--secondary validate-btn" [disabled]="validatingCoupon" (click)="validate.emit()">
      <span>{{ validatingCoupon ? 'Validating…' : 'Validate' }}</span>
    </button>
  </div>

  <div class="coupon-preview-box" *ngIf="couponPreview" [class.valid]="couponPreview.valid">
    <div class="coupon-preview-head">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
      </svg>
      <strong>Coupon Applied Successfully!</strong>
    </div>
    <p class="coupon-message">{{ couponPreview.message }}</p>
    <div class="coupon-details">
      <span>Saved: <strong>{{ couponPreview.discountAmount | currency }}</strong></span>
      <span>New total: <strong>{{ couponPreview.finalAmount | currency }}</strong></span>
    </div>
  </div>
</section>
