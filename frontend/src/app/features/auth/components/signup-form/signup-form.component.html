<form class="auth-card auth-form" [formGroup]="signupForm" (ngSubmit)="submit()" novalidate>
  <div class="auth-card-header">
    <p class="auth-eyebrow">Create account</p>
    <h2>Join the Petites family</h2>
    <p class="auth-subtitle">A few details and you’re ready to pre-order your favourites.</p>
  </div>

  @if (serverError) {
    <div class="auth-alert" role="alert">{{ serverError }}</div>
  }

  <label class="auth-field">
    <span>Full name</span>
    <input type="text" formControlName="name" autocomplete="name" placeholder="Jane Doe" />
    @if (signupForm.controls.name.touched && signupForm.controls.name.invalid) {
      <small>Please enter your name.</small>
    }
    @for (message of serverFieldErrors['name']; track message) {
      <small>{{ message }}</small>
    }
  </label>

  <label class="auth-field">
    <span>Phone</span>
    <input type="tel" formControlName="phone" autocomplete="tel" placeholder="01xxxxxxxxx" />
    @if (signupForm.controls.phone.touched && signupForm.controls.phone.invalid) {
      <small>Please enter a valid phone number.</small>
    }
    @for (message of serverFieldErrors['phone']; track message) {
      <small>{{ message }}</small>
    }
  </label>

  <label class="auth-field">
    <span>Email</span>
    <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
    @if (signupForm.controls.email.touched && signupForm.controls.email.invalid) {
      <small>Enter a valid email address.</small>
    }
    @for (message of serverFieldErrors['email']; track message) {
      <small>{{ message }}</small>
    }
  </label>

  <label class="auth-field">
    <span>Password</span>
    <input type="password" formControlName="password" autocomplete="new-password" placeholder="At least 8 characters" />
    @if (signupForm.controls.password.touched && signupForm.controls.password.invalid) {
      <small>Password must be at least 8 characters.</small>
    }
    @for (message of serverFieldErrors['password']; track message) {
      <small>{{ message }}</small>
    }
  </label>

  <button class="auth-btn" type="submit" [disabled]="loading">
    {{ loading ? 'Creating account…' : 'Create account' }}
  </button>

  <p class="auth-footer">
    Already have an account? <a routerLink="/login">Sign in</a>
  </p>
</form>
