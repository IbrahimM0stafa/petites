<form class="auth-card auth-form" [formGroup]="signupForm" (ngSubmit)="submit()" novalidate>
  <div class="auth-card-header">
    <p class="auth-eyebrow">Create account</p>
    <h2>Join the Petites family</h2>
    <p class="auth-subtitle">A few details and you’re ready to pre-order your favourites.</p>
  </div>

  <div class="auth-alert" *ngIf="serverError" role="alert">{{ serverError }}</div>

  <label class="auth-field">
    <span>Full name</span>
    <input type="text" formControlName="name" autocomplete="name" placeholder="Jane Doe" />
    <small *ngIf="signupForm.controls.name.touched && signupForm.controls.name.invalid">Please enter your name.</small>
    <small *ngFor="let message of serverFieldErrors['name']">{{ message }}</small>
  </label>

  <label class="auth-field">
    <span>Phone</span>
    <input type="tel" formControlName="phone" autocomplete="tel" placeholder="01xxxxxxxxx" />
    <small *ngIf="signupForm.controls.phone.touched && signupForm.controls.phone.invalid">Please enter a valid phone number.</small>
    <small *ngFor="let message of serverFieldErrors['phone']">{{ message }}</small>
  </label>

  <label class="auth-field">
    <span>Email</span>
    <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
    <small *ngIf="signupForm.controls.email.touched && signupForm.controls.email.invalid">Enter a valid email address.</small>
    <small *ngFor="let message of serverFieldErrors['email']">{{ message }}</small>
  </label>

  <label class="auth-field">
    <span>Password</span>
    <input type="password" formControlName="password" autocomplete="new-password" placeholder="At least 8 characters" />
    <small *ngIf="signupForm.controls.password.touched && signupForm.controls.password.invalid">Password must be at least 8 characters.</small>
    <small *ngFor="let message of serverFieldErrors['password']">{{ message }}</small>
  </label>

  <button class="auth-btn" type="submit" [disabled]="loading">
    {{ loading ? 'Creating account…' : 'Create account' }}
  </button>

  <p class="auth-footer">
    Already have an account? <a routerLink="/login">Sign in</a>
  </p>
</form>
