<form class="auth-card auth-form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
  <div class="auth-card-header">
    <p class="auth-eyebrow">Sign in</p>
    <h2>Good to see you again</h2>
    <p class="auth-subtitle">Enter the email and password you used when you joined Petites.</p>
  </div>

  @if (serverError) {
    <div class="auth-alert" role="alert">{{ serverError }}</div>
  }
  @if (successMessage) {
    <div class="auth-alert auth-alert--success" role="alert">{{ successMessage }}</div>
  }

  <label class="auth-field">
    <span>Email</span>
    <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
    @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
      <small>Enter a valid email address.</small>
    }
    @for (message of serverFieldErrors['email']; track message) {
      <small>{{ message }}</small>
    }
  </label>

  <label class="auth-field">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span>Password</span>
      <a routerLink="/forgot-password" style="font-size: 0.8rem; color: var(--petites-accent-deep); font-weight: 600; text-decoration: none; margin-bottom: 0.35rem;">Forgot password?</a>
    </div>
    <input type="password" formControlName="password" autocomplete="current-password" placeholder="At least 8 characters" />
    @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
      <small>Password must be at least 8 characters.</small>
    }
    @for (message of serverFieldErrors['password']; track message) {
      <small>{{ message }}</small>
    }
  </label>

  <button class="auth-btn" type="submit" [disabled]="loading">
    {{ loading ? 'Signing in…' : 'Sign in' }}
  </button>

  <p class="auth-footer">
    New to Petites? <a routerLink="/signup">Create an account</a>
  </p>
</form>
