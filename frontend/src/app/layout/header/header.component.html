<header class="site-header" [class.scrolled]="isScrolled">
  <div class="top-strip">
    <span><span class="heart">♥</span>Made with love in small batches</span>
    <span class="socials" aria-label="Follow us on social media">
      <span class="follow">Follow us on</span>
      <a class="social-link" [href]="socialLinks.instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="none" stroke="currentColor" stroke-width="1.6"></path>
          <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"></circle>
        </svg>
      </a>
      <a class="social-link" [href]="socialLinks.facebook" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 2h-3a4 4 0 0 0-4 4v3H8v4h3v8h4v-8h3l1-4h-4V6a1 1 0 0 1 1-1h2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>
      <a class="social-link" [href]="socialLinks.tiktok" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>
    </span>
  </div>

  <nav class="main-nav desktop-header" aria-label="Primary">
    <div class="nav-group nav-left">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/shop" routerLinkActive="active">Shop <span class="caret" aria-hidden="true"></span></a>
      <a routerLink="/orders" routerLinkActive="active">Orders</a>
      <a routerLink="/loyalty" routerLinkActive="active">Loyalty</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
    </div>

    <a class="brand" routerLink="/" aria-label="Petites home">
      <span class="brand-ring">
        <img class="brand-logo" src="/assets/images/logo.png" alt="Petites logo" />
      </span>
    </a>

    <div class="nav-group nav-right">
      <a routerLink="/faq" routerLinkActive="active">FAQ</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
      <a routerLink="/login" routerLinkActive="active" *ngIf="!authState.isAuthenticated()">Login</a>
      <a routerLink="/signup" routerLinkActive="active" *ngIf="!authState.isAuthenticated()">Signup</a>

      <a class="icon-button" routerLink="/account" aria-label="Account" *ngIf="authState.isAuthenticated()">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5.5 19c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5"></path>
        </svg>
      </a>

      <a class="icon-button cart-button" routerLink="/cart" aria-label="Cart">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
          <path d="M3 5h2l1.1 8.2A2 2 0 0 0 8.1 15h7.8a2 2 0 0 0 1.9-1.4L19 8H6.1"></path>
          <circle cx="9" cy="19" r="1.3"></circle>
          <circle cx="17" cy="19" r="1.3"></circle>
        </svg>
        <span class="badge" *ngIf="cartService.itemCount() > 0">{{ cartService.itemCount() }}</span>
      </a>
    </div>
  </nav>

  <nav class="mobile-header" aria-label="Primary mobile">
    <button
      type="button"
      class="menu-button"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span class="menu-icon" [class.open]="menuOpen" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <a class="brand mobile-brand" routerLink="/" aria-label="Petites home" (click)="closeMenu()">
      <span class="brand-ring">
        <img class="brand-logo" src="/assets/images/logo.png" alt="Petites logo" />
      </span>
    </a>

    <a class="icon-button cart-button mobile-cart" routerLink="/cart" aria-label="Cart">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
        <path d="M3 5h2l1.1 8.2A2 2 0 0 0 8.1 15h7.8a2 2 0 0 0 1.9-1.4L19 8H6.1"></path>
        <circle cx="9" cy="19" r="1.3"></circle>
        <circle cx="17" cy="19" r="1.3"></circle>
      </svg>
      <span class="badge" *ngIf="cartService.itemCount() > 0">{{ cartService.itemCount() }}</span>
    </a>
  </nav>

  <div id="mobile-menu" class="mobile-menu" [class.open]="menuOpen">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
    <a routerLink="/shop" routerLinkActive="active" (click)="closeMenu()">Shop</a>
    <a routerLink="/orders" routerLinkActive="active" (click)="closeMenu()">Orders</a>
    <a routerLink="/loyalty" routerLinkActive="active" (click)="closeMenu()">Loyalty Rewards</a>
    <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
    <a routerLink="/faq" routerLinkActive="active" (click)="closeMenu()">FAQ</a>
    <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
    <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()" *ngIf="!authState.isAuthenticated()">Login</a>
    <a routerLink="/signup" routerLinkActive="active" (click)="closeMenu()" *ngIf="!authState.isAuthenticated()">Signup</a>
    <a routerLink="/account" routerLinkActive="active" (click)="closeMenu()" *ngIf="authState.isAuthenticated()">Account</a>
  </div>
</header>
