<article class="treat-card">
  <div class="treat-art" [ngClass]="artClass" aria-hidden="true"></div>

  <div class="treat-content">
    <h3>{{ name }}</h3>
    <p class="price">{{ price }}</p>
    <a class="add-button" [routerLink]="ctaLink">
      {{ ctaText }}
      <span class="button-heart" aria-hidden="true">♥</span>
    </a>
  </div>
</article>
