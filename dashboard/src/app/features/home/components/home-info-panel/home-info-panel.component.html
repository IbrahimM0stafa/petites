<section class="home-info-panel" aria-label="About and newsletter">
  <div class="promo-half promo-half-left">
    <div class="promo-copy">
      <h3>Made with love <span class="panel-heart">♥</span></h3>
      <p>At Petites, we believe the best things come in small packages. Each treat is crafted with care, using quality ingredients, for your sweetest moments.</p>
      <a class="panel-cta" routerLink="/about">Our Story <span class="cta-heart">♥</span></a>
    </div>

    <div class="panel-art bowl" aria-hidden="true">
      <svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" width="260" height="180" role="img" aria-hidden="true">
        <defs>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#9a5445" flood-opacity="0.18"/>
          </filter>
        </defs>
        <ellipse cx="130" cy="145" rx="72" ry="14" fill="#c78657" opacity="0.12"/>
        <path d="M73 78c0-24 24-39 57-39s57 15 57 39c0 13-5 26-11 35H84c-6-9-11-22-11-35z" fill="#f2d3b5" filter="url(#softShadow)"/>
        <path d="M84 78c0-17 18-28 46-28s46 11 46 28c0 10-3 20-7 27H91c-4-7-7-17-7-27z" fill="#b87b4e"/>
        <path d="M96 65c10-10 19-14 34-14 16 0 27 4 37 14" fill="none" stroke="#fff2e0" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
        <path d="M119 32c0-10 11-16 18-12 8-5 18 2 19 11-6 4-11 10-19 18-7-7-12-13-18-17z" fill="#b78a63"/>
        <rect x="144" y="14" width="8" height="68" rx="4" transform="rotate(35 148 48)" fill="#c9b09a"/>
        <path d="M61 111l-20 8 12 18 18-8z" fill="#b56d4d"/>
        <path d="M178 116l18 8 12-18-20-8z" fill="#9d5428"/>
        <rect x="185" y="128" width="16" height="18" rx="2" transform="rotate(8 193 137)" fill="#8b4a24"/>
        <rect x="202" y="122" width="15" height="17" rx="2" transform="rotate(8 209 130)" fill="#b86c4d"/>
        <rect x="195" y="139" width="15" height="16" rx="2" transform="rotate(8 203 147)" fill="#8b4a24"/>
        <circle cx="63" cy="52" r="4" fill="#d39a54"/>
        <circle cx="44" cy="67" r="3" fill="#b86c4d"/>
        <circle cx="34" cy="42" r="2.5" fill="#d8a38e"/>
        <circle cx="221" cy="49" r="4" fill="#d39a54"/>
        <circle cx="232" cy="63" r="2.5" fill="#b86c4d"/>
      </svg>
    </div>
  </div>

  <div class="promo-half promo-half-right">
    <div class="promo-copy promo-copy-right">
      <h3>Stay Sweet <span class="panel-heart">♥</span></h3>
      <p>Be the first to know about new treats, special offers, and sweet surprises!</p>
      <form class="newsletter" (submit)="$event.preventDefault()">
        <label class="visually-hidden" for="email">Email address</label>
        <input id="email" type="email" placeholder="Your email address" />
        <button class="email-btn" aria-label="Subscribe"><span class="btn-heart">♥</span></button>
      </form>
    </div>

    <div class="panel-art envelope" aria-hidden="true">
      <svg viewBox="0 0 260 170" xmlns="http://www.w3.org/2000/svg" width="260" height="170" role="img" aria-hidden="true">
        <ellipse cx="130" cy="146" rx="56" ry="10" fill="#c78657" opacity="0.08"/>
        <path d="M84 76h92c6 0 11 5 11 11v45c0 6-5 11-11 11H84c-6 0-11-5-11-11V87c0-6 5-11 11-11z" fill="#f9eee8" stroke="#e2c1b4" stroke-width="2"/>

        <path d="M88 90l42 28 42-28" fill="#f3d4c6" opacity="0.95"/>

        <path d="M112 62c0-7 6-12 14-12 3 0 6 1 8 3 2-2 5-3 8-3 8 0 14 5 14 12 0 8-8 15-22 22-14-7-22-14-22-22z" fill="#f0a094"/>
        <circle cx="188" cy="48" r="3.5" fill="#d39a54"/>
        <circle cx="205" cy="63" r="2.5" fill="#d8a38e"/>
        <circle cx="86" cy="54" r="2.5" fill="#d8a38e"/>
      </svg>
    </div>
  </div>
</section>
