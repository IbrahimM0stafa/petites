<form class="login-card" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
	<div class="login-card-header">
		<p class="login-eyebrow">Staff sign in</p>
		<h2>Petites Admin</h2>
		<p class="login-subtitle">Sign in with your staff or super admin account.</p>
	</div>

	<div class="login-alert" *ngIf="serverError" role="alert">{{ serverError }}</div>
	<div class="login-alert" *ngIf="successMessage" role="alert" style="background: #f0fdf4; color: #15803d; border: 1px solid rgba(21, 128, 61, 0.2);">{{ successMessage }}</div>

	<label class="login-field">
		<span>Email</span>
		<input type="email" formControlName="email" autocomplete="email" placeholder="you@petites.com" />
		<small *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">Enter a valid email address.</small>
		<small *ngFor="let message of serverFieldErrors['email']">{{ message }}</small>
	</label>

	<label class="login-field">
		<div style="display: flex; justify-content: space-between; align-items: center;">
			<span>Password</span>
			<a routerLink="/forgot-password" style="font-size: 0.825rem; color: var(--admin-accent); font-weight: 600; text-decoration: none;">Forgot password?</a>
		</div>
		<input type="password" formControlName="password" autocomplete="current-password" placeholder="Your password" />
		<small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">Password must be at least 8 characters.</small>
		<small *ngFor="let message of serverFieldErrors['password']">{{ message }}</small>
	</label>

	<button class="login-btn" type="submit" [disabled]="loading">
		{{ loading ? 'Signing in…' : 'Sign in' }}
	</button>
</form>
