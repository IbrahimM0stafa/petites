<form class="login-card" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
  <div class="login-card-header">
    <p class="login-eyebrow">Staff sign in</p>
    <h2>Petites Admin</h2>
    <p class="login-subtitle">Sign in with your staff or super admin account.</p>
  </div>

  @if (serverError) {
    <div class="login-alert" role="alert">{{ serverError }}</div>
  }
  @if (successMessage) {
    <div class="login-alert" role="alert" style="background: #f0fdf4; color: #15803d; border: 1px solid rgba(21, 128, 61, 0.2);">{{ successMessage }}</div>
  }

  <label class="login-field">
    <span>Email</span>
    <input type="email" formControlName="email" autocomplete="email" placeholder="you@petites.com" />
    @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
      <small>Enter a valid email address.</small>
    }
    @for (message of serverFieldErrors['email']; track message) {
      <small>{{ message }}</small>
    }
  </label>

  <label class="login-field">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span>Password</span>
      <a routerLink="/forgot-password" style="font-size: 0.825rem; color: var(--admin-accent); font-weight: 600; text-decoration: none;">Forgot password?</a>
    </div>
    <input type="password" formControlName="password" autocomplete="current-password" placeholder="Your password" />
    @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
      <small>Password must be at least 8 characters.</small>
    }
    @for (message of serverFieldErrors['password']; track message) {
      <small>{{ message }}</small>
    }
  </label>

  <button class="login-btn" type="submit" [disabled]="loading">
    {{ loading ? 'Signing in…' : 'Sign in' }}
  </button>
</form>
