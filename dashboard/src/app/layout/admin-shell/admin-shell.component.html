<div class="admin-layout">
	<div class="admin-sidebar-backdrop" [class.is-open]="sidebarOpen()" (click)="closeSidebar()"></div>

	<aside class="admin-sidebar" [class.is-open]="sidebarOpen()" aria-label="Admin navigation">
		<div class="admin-brand">
			<span class="admin-brand-mark">P</span>
			<span class="admin-brand-text">Petites Admin</span>
		</div>
		<nav class="admin-nav">
			<a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">Dashboard</a>
			<a routerLink="/users" routerLinkActive="active" (click)="closeSidebar()">Users</a>
		</nav>
	</aside>

	<div class="admin-main">
		<header class="admin-topbar">
			<div class="admin-topbar-left">
				<button type="button" class="admin-menu-toggle" [class.is-active]="sidebarOpen()" (click)="toggleSidebar()" aria-label="Toggle navigation menu">
					<span class="hamburger-line"></span>
					<span class="hamburger-line"></span>
					<span class="hamburger-line"></span>
				</button>
				<h1 class="admin-topbar-title">Petites Admin</h1>
			</div>
			<div class="admin-topbar-actions">
				<span class="admin-user-email" *ngIf="authState.email() as email">{{ email }}</span>
				<button type="button" class="admin-btn admin-btn-ghost" (click)="logout()">Log out</button>
			</div>
		</header>
		<main class="admin-content">
			<router-outlet />
		</main>
	</div>
</div>
