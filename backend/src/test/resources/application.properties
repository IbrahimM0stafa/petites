spring.application.name=backend-test
spring.profiles.active=test

# Point all test executions to the isolated petites_test schema
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/petites?currentSchema=petites_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:abcABC12}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Flyway targeting isolated test schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=petites_test
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway automatically runs migrations on isolated test schema
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.schemas=petites_test
spring.flyway.default-schema=petites_test
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration

# App security settings for tests
app.jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-for-testing!!
app.jwt.issuer=petites-test
app.jwt.expiration-minutes=120
app.jwt.refresh-expiration-days=30
app.jwt.refresh-cleanup-interval-ms=3600000
app.guest-session.ttl-hours=168
app.guest-session.cleanup-interval-ms=3600000
app.cors.allowed-origins=*
app.security.permit-post=/api/auth/login,/api/auth/refresh,/api/users,/api/guest-sessions,/api/auth/forgot-password,/api/auth/verify-otp,/api/auth/reset-password
app.security.permit-get=/api/guest-sessions/current,/api/categories,/api/categories/**,/api/products,/api/products/**,/api/coupons/validate

# Disable background admin seeder in tests
app.seed.admin-users.enabled=false

# Test mail settings
spring.mail.host=localhost
spring.mail.port=1025
management.health.mail.enabled=false
