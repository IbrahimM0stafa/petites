spring.application.name=backend
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-bytes-min}
app.jwt.issuer=${JWT_ISSUER:petites-backend}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
app.jwt.refresh-cleanup-interval-ms=${JWT_REFRESH_CLEANUP_INTERVAL_MS:3600000}
app.guest-session.ttl-hours=${GUEST_SESSION_TTL_HOURS:168}
app.guest-session.cleanup-interval-ms=${GUEST_SESSION_CLEANUP_INTERVAL_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.security.permit-post=${SECURITY_PERMIT_POST:/api/auth/login,/api/auth/refresh,/api/users,/api/guest-sessions,/api/auth/forgot-password,/api/auth/verify-otp,/api/auth/reset-password}
app.security.permit-get=${SECURITY_PERMIT_GET:/api/guest-sessions/current,/api/categories,/api/categories/**,/api/products,/api/products/**,/api/coupons/validate}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}
app.mail.from=${APP_MAIL_FROM:noreply@petites.com}

# Disable mail health check in Actuator
management.health.mail.enabled=false
