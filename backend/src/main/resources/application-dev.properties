spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petites}
spring.datasource.username=${DB_USER:petites}
spring.datasource.password=${DB_PASSWORD:petites}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

# Dev-only seeded admin accounts (see AdminUserSeeder; password is abcABC12$$ in code)
app.seed.admin-users.enabled=true
app.seed.admin-users.sync-existing=false
app.seed.super-admin.email=SUPERADMIN@petites.com
app.seed.staff.email=STAFF@petites.com
server.port=8080

# Spring Mail Dev Defaults
spring.mail.host=${SPRING_MAIL_HOST:smtp.resend.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:resend}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

